name: Deploy to Vercel (Production)

# Deploy lewat Vercel CLI + token — BUKAN native Git integration.
# Kenapa: satu GitHub account hanya bisa "login-connect" ke SATU Vercel
# account. Karena tetra-ops / Tiska / Sinara hidup di 3 Vercel account
# (email berbeda, masing-masing Hobby/free), native Git integration saling
# rebutan koneksi GitHub dan terus lepas. CI pakai token per-account, jadi
# tidak butuh koneksi login GitHub↔Vercel sama sekali → tidak pernah lepas.
#
# SETUP (sekali saja):
#   1. Di akun Vercel pemilik project ini (visualtetra@gmail.com):
#      Settings → Tokens → Create Token (scope ke team yang punya project).
#   2. Di GitHub repo ramaactivity/tetra-ops:
#      Settings → Secrets and variables → Actions → New repository secret
#      Name: VERCEL_TOKEN   Value: <token tadi>
#   3. Di Vercel project tetra-ops: Settings → Git → Disconnect repository
#      (supaya tidak dobel-deploy dengan CI, dan tidak lagi butuh koneksi
#      login GitHub di account-level).
# Setelah itu koneksi GitHub di SEMUA account Vercel boleh dibiarkan lepas.

on:
  push:
    branches: [main]

# Hanya satu deploy production berjalan dalam satu waktu; push baru
# membatalkan build lama yang belum selesai.
concurrency:
  group: vercel-production
  cancel-in-progress: true

# orgId & projectId bukan rahasia (cuma identifier) — di-inline dari
# .vercel/project.json supaya setup cukup 1 secret (VERCEL_TOKEN).
env:
  VERCEL_ORG_ID: team_dTn9InAoDuNiGiK1ca7VOSBB
  VERCEL_PROJECT_ID: prj_UVCHJJqig4Ccbfw6Iwz57pMTrjye

jobs:
  # Gate: unit test math finance (cepat, tanpa secret). Kalau merah → deploy
  # tidak jalan. Mencegah regresi HPP/jurnal naik ke produksi.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # butuh history utk diff file yang berubah (lint step)

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GATE: unit test wajib hijau (lihat job-level needs di deploy).
      - name: Unit tests (finance math)
        run: pnpm test

      # Lint HANYA file yang berubah. NON-BLOKING: repo punya baseline ~336 isu
      # biome lama (a11y/style) yang menyebar di banyak file, jadi `biome check .`
      # penuh belum bisa jadi gate keras tanpa cleanup besar. Step ini melaporkan
      # isu pada file yang kamu sentuh di log Actions tanpa menggagalkan deploy.
      # Target berikutnya: bersihkan baseline lalu naikkan jadi gate (hapus
      # continue-on-error).
      - name: Lint changed files (biome, non-blocking)
        continue-on-error: true
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.sha }}~1"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" "${{ github.sha }}" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' 2>/dev/null | tr '\n' ' ')
          if [ -z "$FILES" ]; then echo "Tidak ada file lintable yang berubah."; exit 0; fi
          echo "Lint file berubah: $FILES"
          pnpm exec biome check $FILES

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Link project + tarik setting production (pakai ORG/PROJECT id dari env).
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # KUNCI: Vercel Hobby memblok deploy yang commit-author-nya tak cocok
      # dengan akun GitHub di team ("commit email could not be matched"). Karena
      # login GitHub sengaja TIDAK di-connect (biar tidak rebutan antar 3 akun
      # Vercel), kita buang folder .git supaya CLI tidak mengirim metadata commit.
      # Deploy lalu diatribusikan ke PEMILIK TOKEN (anggota team) → lolos.
      # .gitignore (file) tetap ada, jadi node_modules dll tetap di-exclude.
      - name: Strip git metadata (deploy as token owner, not commit author)
        run: rm -rf .git

      # Build DI VERCEL. Vercel yang install pnpm & build pakai cache-nya sendiri
      # — sama seperti native Git dulu (~1,5 menit).
      - name: Deploy (Vercel builds & promotes to production)
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
